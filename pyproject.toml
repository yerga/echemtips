[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echemtips"
version = "0.1.0"
description = "Open Python control and analysis interface for scanning electrochemistry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
authors = [{name = "yerga"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
fpga = ["nifpga>=22.0.0"]
analysis = ["nptdms>=1.7"]

[project.scripts]
echemtips = "echemtips.app:main"
echemtips-analysis = "echemtips.analysis:main"
echemtips-hardware-check = "echemtips.hardware_check:main"

[project.urls]
Repository = "https://github.com/yerga/echemtips"
Issues = "https://github.com/yerga/echemtips/issues"

[tool.setuptools.packages.find]
include = ["echemtips*"]
